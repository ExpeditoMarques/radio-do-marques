<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Rádio do Marquês</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121e30;--line:#26364c;--accent:#20d6a1;--text:#f4f7fb;--muted:#a9b8ca}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#1b3150,var(--bg) 58%);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:22px}
main{width:min(100%,720px)}header{text-align:center;padding:20px 12px 26px}.logo{width:74px;height:74px;margin:0 auto 14px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#20d6a1,#1686d9);font-size:32px;font-weight:900;color:#071522;box-shadow:0 12px 36px #0005}h1{font-size:clamp(28px,6vw,42px);margin:0 0 8px}p{color:var(--muted);line-height:1.55;margin:8px 0}.card{background:#121e30ed;border:1px solid var(--line);border-radius:22px;padding:24px;margin:14px 0;box-shadow:0 18px 48px #0003}.live{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.dot{width:10px;height:10px;background:#75849a;border-radius:50%}.dot.on{background:#20d6a1;box-shadow:0 0 0 5px #20d6a122}.player{display:flex;gap:16px;align-items:center;margin-top:18px}.play{border:0;border-radius:50%;width:58px;height:58px;flex-shrink:0;background:var(--accent);color:#071522;font-size:23px;cursor:pointer}.player-info{flex:1;min-width:0}.player-info strong{display:block;font-size:19px}.player-info span{color:var(--muted);font-size:14px}audio{width:100%;margin-top:18px;height:42px}button,input{font:inherit}button.action{border:0;border-radius:12px;padding:12px 16px;font-weight:750;background:var(--accent);color:#071522;cursor:pointer}button.secondary{background:#24354b;color:var(--text);border:1px solid #3a4b62}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.field{display:block;margin:14px 0 6px;color:var(--muted);font-size:14px}input[type=password]{width:100%;background:#0a1422;border:1px solid #34465d;border-radius:10px;padding:12px;color:var(--text)}.hidden{display:none!important}.status{margin-top:12px;font-size:14px;min-height:20px}.small{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body><main>
<header><div class="logo">RM</div><h1>Rádio do Marquês</h1><p>Sua companhia, onde você estiver.</p></header>
<section class="card">
<div class="live"><span id="dot" class="dot"></span><span id="live-label">Verificando transmissão</span></div>
<div class="player"><button class="play" id="play" aria-label="Reproduzir">▶</button><div class="player-info"><strong>Ao vivo — Rádio do Marquês</strong><span id="player-status">Pressione play para ouvir</span></div></div>
<audio id="audio" controls preload="none" src="/stream/live.mp3"></audio>
</section>
<section class="card">
<h2>🎙️ Painel do locutor</h2><p>Somente pessoas autorizadas podem transmitir. Use HTTPS e permita o acesso ao microfone.</p>
<label class="field" for="token">Token de transmissão</label><input id="token" type="password" autocomplete="current-password" placeholder="Digite seu token secreto">
<div class="row"><button id="start" class="action">Iniciar transmissão</button><button id="stop" class="action secondary" disabled>Encerrar</button></div>
<div id="mic-status" class="status" role="status"></div>
</section>
<div class="small">Rádio do Marquês • Transmissão pública de áudio</div>
</main>
<script>
const audio=document.getElementById('audio'), play=document.getElementById('play'), start=document.getElementById('start'), stop=document.getElementById('stop'), token=document.getElementById('token'), micStatus=document.getElementById('mic-status');
let stream=null, recorder=null, socket=null;
play.addEventListener('click',async()=>{try{if(audio.paused){await audio.play();play.textContent='Ⅱ';document.getElementById('player-status').textContent='Reproduzindo';}else{audio.pause();play.textContent='▶';document.getElementById('player-status').textContent='Pausado';}}catch(e){document.getElementById('player-status').textContent='A transmissão ainda não está disponível.';}});
audio.addEventListener('pause',()=>play.textContent='▶');audio.addEventListener('play',()=>play.textContent='Ⅱ');
async function refreshStatus(){try{const r=await fetch('/api/status',{cache:'no-store'});const d=await r.json();document.getElementById('dot').classList.toggle('on',d.live);document.getElementById('live-label').textContent=d.live?'Transmissão ao vivo':'Fora do ar';}catch(e){document.getElementById('live-label').textContent='Status indisponível';}}
setInterval(refreshStatus,8000);refreshStatus();
start.addEventListener('click',async()=>{
 if(!token.value.trim()){micStatus.textContent='Digite o token de transmissão.';return;}
 start.disabled=true;micStatus.textContent='Solicitando acesso ao microfone…';
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  const proto=location.protocol==='https:'?'wss:':'ws:';
  socket=new WebSocket(`${proto}//${location.host}/broadcast?token=${encodeURIComponent(token.value.trim())}`);
  socket.binaryType='arraybuffer';
  socket.onopen=()=>{
   const mime=['audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));
   recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
   recorder.ondataavailable=async e=>{if(e.data.size&&socket&&socket.readyState===WebSocket.OPEN){const buf=await e.data.arrayBuffer();if(socket.readyState===WebSocket.OPEN)socket.send(buf);}};
   recorder.start(250);stop.disabled=false;micStatus.textContent='Microfone ativo. Você está transmitindo ao vivo.';
  };
  socket.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='error')micStatus.textContent=d.message;}catch(_){}};
  socket.onerror=()=>{micStatus.textContent='Não foi possível conectar. Confira o token e os logs do servidor.';};
  socket.onclose=()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;recorder=null;socket=null;start.disabled=false;stop.disabled=true;refreshStatus();};
 }catch(e){micStatus.textContent='Erro: permita o microfone e verifique se o site está em HTTPS. '+e.message;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;start.disabled=false;}
});
stop.addEventListener('click',()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();if(socket)socket.close();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;recorder=null;socket=null;start.disabled=false;stop.disabled=true;micStatus.textContent='Transmissão encerrada.';refreshStatus();});
</script>
</body></html>
